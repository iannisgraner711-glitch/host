<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Site</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 24px; font-size: 1.8rem; }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 300px;
    }
    a.button {
      padding: 16px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 12px;
      text-align: center;
      transition: background 0.2s;
    }
    a.button:hover { background: #0284c7; color: white; }
  </style>
</head>
<body>

  <h1>Where would you like to go?</h1>
  
  <div class="btn-container">
    <a href="uno-ug.onrender.com" class="button">Go to Site 1</a>
    <a href="wavy-qpvo.onrender.com" class="button">Go to Site 2</a>
  </div>

</body>
</html>
