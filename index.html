<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Game</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    /* Sakura / Rio de Janeiro Theme */
    [data-theme="sakura"] {
      --bg: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #7f7fd5 100%);
      --card: rgba(255, 255, 255, 0.15);
      --text: #ffffff;
      --muted: #ffeef2;
      --border: rgba(255, 255, 255, 0.3);
    }

    /* Midnight Blue Theme */
    [data-theme="midnight"] {
      --bg: #030712;
      --card: #111827;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 16px;
      transition: background 0.4s ease;
    }

    /* Theme Switcher Selector */
    .theme-selector {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .theme-selector option {
      background: #0f172a;
      color: white;
    }

    h1 {
      margin-bottom: 28px;
      font-size: 2rem;
      letter-spacing: -0.5px;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 320px;
    }

    a.button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 24px;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
      border-radius: 16px;
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px);
    }

    a.button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    a.button:active {
      transform: scale(0.98);
    }

    /* UNO Button Styling */
    .btn-uno {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
      border: 2px solid #f87171;
    }

    /* Wavy Button Styling */
    .btn-wavy {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #0f172a;
      border: 2px solid #7dd3fc;
    }

    svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Theme Dropdown -->
  <select id="themeSelect" class="theme-selector">
    <option value="dark">🌙 Classic Dark</option>
    <option value="sakura">🌸 Sakura (Rio Sunset)</option>
    <option value="midnight">🌌 Midnight Blue</option>
  </select>

  <h1>Choose a Game</h1>
  
  <div class="btn-container">
    <!-- UNO Button -->
    <a href="https://uno-ig.onrender.com" target="_blank" rel="noopener noreferrer" class="button btn-uno">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="5" width="11" height="16" rx="2" transform="rotate(-12 9.5 13)" fill="rgba(255,255,255,0.2)"/>
        <rect x="9" y="3" width="11" height="16" rx="2" transform="rotate(8 14.5 11)" fill="rgba(255,255,255,0.35)"/>
        <ellipse cx="14.5" cy="11" rx="3.5" ry="5" transform="rotate(25 14.5 11)" stroke="#fde047" stroke-width="2"/>
      </svg>
      <span>UNO</span>
    </a>

    <!-- Wavy Button -->
    <a href="https://wavy-qpvo.onrender.com" target="_blank" rel="noopener noreferrer" class="button btn-wavy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0" />
        <path d="M2 14c2-2 4-2 6 0s4 2 6 0 4-2 6 0" />
        <path d="M2 20c2-2 4-2 6 0s4 2 6 0 4-2 6 0" />
      </svg>
      <span>Wavy</span>
    </a>
  </div>

  <script>
    const themeSelect = document.getElementById('themeSelect');
    const htmlElement = document.documentElement;

    // Load saved theme preference if available
    const savedTheme = localStorage.getItem('site_theme') || 'dark';
    htmlElement.setAttribute('data-theme', savedTheme);
    themeSelect.value = savedTheme;

    // Change theme on selection and save to browser storage
    themeSelect.onchange = (e) => {
      const selectedTheme = e.target.value;
      htmlElement.setAttribute('data-theme', selectedTheme);
      localStorage.setItem('site_theme', selectedTheme);
    };
  </script>

</body>
</html>
